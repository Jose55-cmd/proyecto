<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Corretaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>Panel de Control</h1>
        <div class="row text-center">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h3>Clientes</h3>
                    <p class="display-4">{{ total_clientes }}</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm bg-primary text-white">
                    <h3>Pólizas Activas</h3>
                    <p class="display-4">{{ total_polizas }}</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm bg-danger text-white">
                    <h3>Siniestros</h3>
                    <p class="display-4">{{ siniestros_pendientes }}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
